name: smartkitchen
region: nyc

# Backend Service (FastAPI)
services:
- name: backend
  github:
    branch: main
    deploy_on_push: true
    repo: nur-evsankurak/SmartKitchen
  source_dir: /backend
  environment_slug: python
  run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs

  envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: FRONTEND_URL
    value: ${APP_URL}/smartkitchen-frontend
    scope: RUN_AND_BUILD_TIME
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: PINECONE_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: SMTP_HOST
    value: smtp.gmail.com
    scope: RUN_AND_BUILD_TIME
  - key: SMTP_PORT
    value: "587"
    scope: RUN_AND_BUILD_TIME
  - key: SMTP_USER
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: SMTP_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: PORT
    value: "8080"
    scope: RUN_AND_BUILD_TIME

  health_check:
    http_path: /health
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3

  routes:
  - path: /

# Frontend Static Site (React)
static_sites:
- name: frontend
  github:
    branch: main
    deploy_on_push: true
    repo: nur-evsankurak/SmartKitchen
  source_dir: /frontend
  output_dir: /dist
  build_command: npm install && npm run build

  envs:
  - key: VITE_API_URL
    value: ${backend.PUBLIC_URL}
    scope: BUILD_TIME

  index_document: index.html
  error_document: index.html
  catchall_document: index.html

  routes:
  - path: /smartkitchen-frontend

# Database
databases:
- name: smartkitchen-db
  engine: PG
  version: "14"
  production: false
  cluster_name: smartkitchen-cluster
